name: Wallet build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node --input-type=module -e "import p from './package.json' with {type:'json'}; if('v'+p.version!==process.env.GITHUB_REF_NAME)throw Error('Tag and package version differ')"
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:update
      - name: Verify reproducible packaging and reject extra files
        shell: bash
        run: |
          cp output/*.sha256 /tmp/wallet-checksum
          node scripts/package.mjs
          cmp /tmp/wallet-checksum output/*.sha256
          touch extension/fixture-probe.json
          if node scripts/package.mjs; then
            echo 'Unexpected files were accepted by the packager'
            exit 1
          fi
          npm run package
          test ! -e extension/fixture-probe.json
          cmp /tmp/wallet-checksum output/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flush-wallet
          path: |
            output/flush-wallet-*.zip
            output/flush-wallet-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the checked package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name flush-wallet --dir output
      - name: Publish the betanet package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" output/flush-wallet-*.zip output/flush-wallet-*.zip.sha256 --verify-tag --prerelease --title "Flush Wallet $GITHUB_REF_NAME — Betanet" --notes-file distribution/RELEASE.md
